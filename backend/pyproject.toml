[project]
name = "agentops-backend"
version = "0.1.0"
description = "AgentOps AI Platform backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "pyjwt>=2.9,<3",
    "python-multipart>=0.0.12,<0.1",
    "google-genai>=2.19,<3",
    "langgraph>=0.2,<1",
    "mcp>=1.2,<2",
    "httpx>=0.28.1,<1",
    "pgvector>=0.3,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pyyaml>=6.0,<7",
    "litellm>=1.52,<2",
    "redis>=5.2,<6",
    # Phase 13: TestCase.output_schema validation (app/evaluation/checks/
    # output_schema.py) — the standard, free, pure-Python JSON Schema
    # validator (declarative only, no eval/exec internally), rather than
    # hand-rolling a JSON Schema implementation.
    "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.28.1,<1",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]