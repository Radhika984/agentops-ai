[alembic]
# Path to migration scripts, relative to this ini file (i.e. relative to
# the backend/ directory, since you run `uv run alembic` from there).
script_location = alembic

# Version file naming — left at Alembic's default.
# version_path_separator = os

# Timezone for revision timestamps in filenames/messages. Not required.
# timezone =

# No database URL here on purpose. alembic/env.py overrides
# sqlalchemy.url at runtime from the application's Settings
# (DATABASE_URL, sourced from environment variables / .env), so no
# credentials are ever hardcoded in this file.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured.

# ---------------------------------------------------------------------
# Logging configuration.
# alembic/env.py calls fileConfig(config.config_file_name), which reads
# the sections below. They must exist or that call raises at import time,
# independently of script_location.
# ---------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S